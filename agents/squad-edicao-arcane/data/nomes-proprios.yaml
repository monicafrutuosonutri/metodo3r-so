# ─────────────────────────────────────────────────────────────────────────────
# nomes-proprios.yaml — Mônica Frutuoso
# ─────────────────────────────────────────────────────────────────────────────
# O squad usa esse arquivo em DOIS lugares:
#
# 1. video-transcribe.py: alimenta o whisper com `--prompt` (whisper transcreve
#    melhor nomes proprios quando recebe contexto)
#
# 2. revisao do @scribe na main thread: o agente conhece os nomes corretos e
#    corrige variantes erradas conforme o dicionario abaixo
#
# CRITICO: so coloque aqui nomes que VOCE realmente fala nos seus videos. O
# whisper tenta encaixar esses nomes na fala de QUALQUER video que voce editar.
# ─────────────────────────────────────────────────────────────────────────────

# Lista plana de nomes corretos — vai pro --prompt do whisper
nomes_corretos:
  # Nome e marca
  - "Mônica Frutuoso"
  - "Método 3R"
  - "Reconhecer, Reorganizar, Reconstruir"
  - "Confiança Blindada"
  - "Blindagem Antirreganho"
  # Area e credenciais
  - "nutrição comportamental"
  - "nutricionista comportamental"
  - "CRN-3"
  - "Sophie Deram"
  # Termos tecnicos do nicho
  - "interocepção"
  - "saciedade"
  - "compulsão alimentar"
  - "reganho de peso"
  - "efeito sanfona"
  - "comportamento alimentar"
  - "fome emocional"
  - "escala de fome"
  - "mindful eating"
  - "análogo de GLP-1"
  - "agonista de GLP-1"
  - "caneta emagrecedora"
  - "Ozempic"
  - "Mounjaro"
  - "semaglutida"
  - "tirzepatida"

# Correcoes automaticas aplicadas pelo @scribe quando le o transcript bruto.
# Formato: errado (como whisper transcreveu) -> correto (como deveria ser)
# Case-insensitive na busca, exato na substituicao.
#
# As abaixo sao PALPITES iniciais das variantes mais provaveis. Confirme com o
# uso: edite um video, veja como o whisper de fato errou, ajuste esta lista.
correcoes_automaticas:
  - errado: "Monica Frutuoso"
    correto: "Mônica Frutuoso"
  - errado: "Metodo 3R"
    correto: "Método 3R"
  - errado: "Método 3 R"
    correto: "Método 3R"
  - errado: "metodo três R"
    correto: "Método 3R"
  - errado: "CRN 3"
    correto: "CRN-3"
  - errado: "GLP1"
    correto: "GLP-1"
  - errado: "GLP 1"
    correto: "GLP-1"
  - errado: "Sofi Deram"
    correto: "Sophie Deram"
  - errado: "Sophie Deran"
    correto: "Sophie Deram"
  - errado: "mindfull eating"
    correto: "mindful eating"
  - errado: "zenpique"
    correto: "Ozempic"
  - errado: "ozempique"
    correto: "Ozempic"
  - errado: "monjaro"
    correto: "Mounjaro"
  - errado: "manjaro"
    correto: "Mounjaro"

# Correcoes de acentuacao recorrentes (whisper as vezes esquece acento em pt-BR).
# O @scribe varre o transcript e aplica essas.
correcoes_ortografia:
  - errado: "voce "          # com espaco pra evitar afetar "vocês"
    correto: "você "
  - errado: "Monica"
    correto: "Mônica"
  - errado: "nutricao"
    correto: "nutrição"
  - errado: "interocepcao"
    correto: "interocepção"
  - errado: "compulsao"
    correto: "compulsão"
  - errado: "confianca"
    correto: "confiança"
